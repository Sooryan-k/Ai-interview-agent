<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — DryRun AI</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.5rem;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        margin: 0;
        color: #71717a;
        max-width: 32ch;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        border: 1px solid #71717a55;
        background: transparent;
        font-size: 0.875rem;
        cursor: pointer;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>This page hasn't been visited before, so it isn't available offline. Reconnect and try again.</p>
    <button onclick="location.reload()">Reload</button>
  </body>
</html>
